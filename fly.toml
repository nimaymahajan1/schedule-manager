# fly.toml app configuration file generated for nimay-planner-relay on 2026-10-09T11:14:29-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nimay-planner-relay'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.relay'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1024mb'
